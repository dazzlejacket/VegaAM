<!doctype html>
<html lang="en">
  <head>

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <title>VegaAM Settings</title>
    <link rel="stylesheet" href="../styles/quick.css" />
  </head>
  <body>
    <button
      class="orb"
      id="open-orb"
      type="button"
      title="VegaAM settings (Ctrl+Shift+,)"

      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">

          d="M12 15.1a3.1 3.1 0 1 0 0-6.2 3.1 3.1 0 0 0 0 6.2Z"
          stroke="currentColor"
          stroke-width="1.7"
        />
        <path

          stroke="currentColor"
          stroke-width="1.45"
          stroke-linejoin="round"
        />

      <span class="spark" aria-hidden="true"></span>
    </button>
    <script src="./orb.js"></script>

</html>

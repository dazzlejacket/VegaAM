name: Release

# The release build and the GitHub release it publishes.
#
# Everything in this workflow is OPTIONAL so that anybody can cut a release
# from a fork:
#
#   1. The Last.fm application credentials. The open-source build ships
#      WITHOUT a built-in key pair - Last.fm's API terms expect every
#      application to identify itself with its own credentials, and a key pair
#      baked into a binary is extractable by anyone who installs it. Users
#      supply their own key pair in Settings -> Accounts. If the maintainer
#      configures the repository secrets below, the pair is baked into the
#      build instead. A shared secret that was published publicly is always a
#      hard failure (see build/revokedSecrets.mjs).
#
#   2. The macOS signing identity. Without a stable Developer ID signature
#      macOS asks for Keychain permission on every update - see
#      docs/MACOS_KEYCHAIN.md. Without a certificate the build still
#      succeeds, but the artifact is unsigned.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  # The release itself is created by this workflow, so the token needs write
  # access to the repository contents.
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform must not cancel the others: a release with two of the
      # three platforms is far better than no release at all.
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            package: npx electron-builder --win --x64 --publish never
            # The arm64 NSIS installer is a cross-build. It is best effort: a
            # missing arm64 installer must not cost the whole release.
            package_extra: npx electron-builder --win --arm64 --publish never
            artifact: windows-installers
            path: release/*.exe
          - name: macOS installer
            os: macos-latest
            package: npx electron-builder --mac --publish never
            artifact: macos-installers
            path: |
              release/*.dmg
              release/*.zip
          - name: Linux packages
            os: ubuntu-latest
            package: npx electron-builder --linux --x64 --publish never
            # The arm64 AppImage has to be cross-built on an x64 runner. It is
            # best effort: a missing arm64 AppImage must not cost the whole
            # release.
            package_extra: npx electron-builder --linux --arm64 --publish never
            artifact: linux-packages
            path: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
    env:
      # Optional: the maintainer's own Last.fm application credentials.
      # Never printed, never committed.
      VEGAAM_LASTFM_API_KEY: ${{ secrets.VEGAAM_LASTFM_API_KEY }}
      VEGAAM_LASTFM_API_SECRET: ${{ secrets.VEGAAM_LASTFM_API_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # The signing and notarization variables must NOT be defined when the
      # repository has no such secret: electron-builder treats any non-null
      # CSC_LINK as a certificate FILE PATH, resolves an empty string against
      # the project directory and aborts with "<project dir> not a file".
      # Exporting them from GITHUB_ENV only when they exist keeps an
      # unsigned build working for everybody who forks the repository.
      - name: Export the optional signing configuration
        if: runner.os == 'macOS'
        id: signing
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.MACOS_CSC_LINK }}" ]; then
            {
              echo "CSC_LINK=${{ secrets.MACOS_CSC_LINK }}"
              echo "CSC_KEY_PASSWORD=${{ secrets.MACOS_CSC_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "macos_signed=true" >> "$GITHUB_OUTPUT"
            echo "macOS signing: configured."
          else
            echo "macos_signed=false" >> "$GITHUB_OUTPUT"
            echo "macOS signing: not configured - the artifact will be unsigned."
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ] \
            && [ -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ] \
            && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            {
              echo "APPLE_ID=${{ secrets.APPLE_ID }}"
              echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
              echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            } >> "$GITHUB_ENV"
            echo "Apple notarization: configured."
          else
            echo "Apple notarization: not configured - the artifact is not notarized."
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install rpmbuild (needed by the rpm target)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Report the optional release configuration
        # Git Bash on the Windows runner: this step uses shell syntax, and the
        # default shell there is PowerShell.
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VEGAAM_LASTFM_API_KEY}" ] && [ -n "${VEGAAM_LASTFM_API_SECRET}" ]; then
            echo "Last.fm credentials: configured (a built-in key pair will be baked in)."
          else
            echo "Last.fm credentials: not configured (users will enter their own key pair)."
          fi

      - name: Typecheck and test
        shell: bash
        run: |
          npm run typecheck
          npm test

      # `--release` stops the build when the shared secret is the revoked one.
      # Missing credentials are only a warning in the open-source build.
      # `--publish never` keeps electron-builder from publishing on its own:
      # the release assets are uploaded by the publish job below.
      - name: Build the installers
        shell: bash
        run: |
          npm run build -- --release
          ${{ matrix.package }}

      - name: Package the extra architecture (best effort)
        if: matrix.package_extra != ''
        continue-on-error: true
        shell: bash
        run: ${{ matrix.package_extra }}

      - name: Verify the macOS signature and bundle identity
        if: steps.signing.outputs.macos_signed == 'true'
        run: |
          set -euo pipefail
          APP="$(find release/mac* -maxdepth 1 -name '*.app' | head -1)"
          echo "application: ${APP}"
          codesign -dv --verbose=4 "${APP}" 2>&1 | tee mac-signature.txt
          codesign --verify --deep --strict --verbose=2 "${APP}"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP}/Contents/Info.plist" \
            | tee mac-bundle-id.txt
          grep -q "Authority=Developer ID Application" mac-signature.txt

      - name: Upload the release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # A tag push carries the version in the tag name; a manual dispatch
          # carries it in the input.
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${TAG#v}"
          fi
          echo "release: ${TAG} (version ${VERSION})"

          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets were built."
            exit 1
          fi
          echo "assets:"
          printf '  %s\n' "${assets[@]}"

          # The notes file is named after the release tag, with or without
          # the leading "v".
          notes=""
          for candidate in "release-notes-${VERSION}.md" "release-notes-v${VERSION}.md"; do
            if [ -f "${candidate}" ]; then
              notes="${candidate}"
              break
            fi
          done
          if [ -z "${notes}" ]; then
            echo "::warning::No release notes file found for version ${VERSION}."
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
            if [ -n "${notes}" ]; then
              gh release edit "${TAG}" --title "VegaAM ${VERSION}" --notes-file "${notes}"
            fi
          elif [ -n "${notes}" ]; then
            gh release create "${TAG}" "${assets[@]}" \
              --title "VegaAM ${VERSION}" --notes-file "${notes}"
          else
            gh release create "${TAG}" "${assets[@]}" \
              --title "VegaAM ${VERSION}" --generate-notes
          fi

          echo "release published: $(gh release view "${TAG}" --json url --jq .url)"
